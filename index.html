<!DOCTYPE html>
<html lang="ar" dir="rtl" data-accent="gold">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>نغم</title>
<meta name="description" content="مشغل موسيقى أنيق يعمل في الخلفية">
<meta name="theme-color" content="#0a0a0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="نغم">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0c; --bg2:#111115; --card:#16161b; --card2:#1e1e25; --line:rgba(255,255,255,.07);
  --text:#f4f1ea; --mute:#9b968d; --dim:#6b675f;
  --acc:#e9b660; --acc2:#f7d894; --accInk:#1c1306; --accGlow:rgba(233,182,96,.28);
  --danger:#ff6b5e;
  --tabH:60px; --safeB:env(safe-area-inset-bottom); --safeT:env(safe-area-inset-top);
  --miniH:62px;
  --r:16px;
  --font:'IBM Plex Sans Arabic',-apple-system,BlinkMacSystemFont,'SF Arabic','Segoe UI',Tahoma,sans-serif;
}
[data-accent=coral]{--acc:#ff7d5c;--acc2:#ffb49c;--accInk:#1f0a04;--accGlow:rgba(255,125,92,.28)}
[data-accent=teal]{--acc:#41d1b7;--acc2:#9ff0e0;--accInk:#03201b;--accGlow:rgba(65,209,183,.25)}
[data-accent=violet]{--acc:#a88bff;--acc2:#d6c9ff;--accInk:#140b2b;--accGlow:rgba(168,139,255,.28)}
[data-accent=rose]{--acc:#ff7aa2;--acc2:#ffc1d3;--accInk:#2a0712;--accGlow:rgba(255,122,162,.26)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
input,textarea{user-select:text;-webkit-user-select:text}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
img{display:block}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.f{fill:currentColor;stroke:none}
.hidden{display:none!important}

#app{position:fixed;inset:0;z-index:1;background:var(--bg)}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding:calc(var(--safeT) + 14px) 18px calc(var(--tabH) + var(--safeB) + var(--miniH) + 34px);display:none}
.view.active{display:block;animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
body.nomini .view{padding-bottom:calc(var(--tabH) + var(--safeB) + 28px)}

/* Headings */
.eyebrow{color:var(--mute);font-size:14px;font-weight:500;margin:4px 0 2px}
h1.lt{font-size:32px;font-weight:700;margin:0 0 18px;letter-spacing:-.3px;line-height:1.25}
.sec{display:flex;align-items:center;justify-content:space-between;margin:26px 0 10px}
.sec h2{font-size:19px;font-weight:700;margin:0}
.link{color:var(--acc);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;padding:6px 2px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px}

/* Buttons */
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--text);flex:none;transition:transform .15s,background .2s}
.ib:active{transform:scale(.9);background:rgba(255,255,255,.06)}
.ib.soft{background:var(--card2)}
.ib.acc{background:var(--acc);color:var(--accInk)}
.btn{height:46px;border-radius:23px;padding:0 20px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:15px;background:var(--card2);transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.96)}
.btn.pri{background:linear-gradient(135deg,var(--acc2),var(--acc));color:var(--accInk);box-shadow:0 8px 24px var(--accGlow)}
.btn.sm{height:36px;font-size:13.5px;padding:0 14px}
.btn.danger{color:var(--danger)}
.btn svg.i{width:20px;height:20px}

/* Rows */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:8px 6px;margin:0 -6px;border-radius:14px;position:relative;transition:background .2s}
.row:active{background:rgba(255,255,255,.04)}
.row .num{width:22px;text-align:center;color:var(--dim);font-size:14px;font-weight:600;flex:none;font-variant-numeric:tabular-nums}
.row .th{width:52px;height:52px;border-radius:10px;overflow:hidden;background:var(--card2);flex:none;position:relative}
.row .th img{width:100%;height:100%;object-fit:cover}
.row.wide .th{width:136px;height:77px;border-radius:12px}
.row .dur{position:absolute;bottom:5px;left:5px;background:rgba(0,0,0,.78);font-size:11px;font-weight:600;padding:1px 6px;border-radius:6px;direction:ltr}
.row .meta{flex:1;min-width:0}
.row .t{font-size:15px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row:not(.wide) .t{-webkit-line-clamp:1;white-space:nowrap;text-overflow:ellipsis;display:block}
.row .s{font-size:13px;color:var(--mute);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.now .t{color:var(--acc)}
.row .ib{width:36px;height:36px;color:var(--mute)}
.row .grip{width:36px;height:40px;display:grid;place-items:center;color:var(--dim);touch-action:none}
.row.drag{z-index:5;background:var(--card2);box-shadow:0 12px 30px rgba(0,0,0,.5);transition:none}
.thnow{position:absolute;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
.eq i{width:3px;background:var(--acc);border-radius:2px;height:4px}
body.is-playing .eq i{animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.3s!important}.eq i:nth-child(3){animation-delay:-.6s!important}
@keyframes eq{0%,100%{height:4px}50%{height:14px}}

/* Cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.empty{text-align:center;padding:44px 20px;color:var(--mute)}
.empty .ico{width:74px;height:74px;border-radius:24px;margin:0 auto 16px;display:grid;place-items:center;background:linear-gradient(145deg,var(--card2),var(--card));border:1px solid var(--line);color:var(--acc)}
.empty .ico svg{width:34px;height:34px}
.empty h3{color:var(--text);font-size:18px;margin:0 0 6px}
.empty p{margin:0 0 18px;font-size:14px;line-height:1.7}

/* Home */
.hero{position:relative;border-radius:22px;overflow:hidden;padding:18px;display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);margin-bottom:6px}
.hero .bgi{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(34px) saturate(1.4);opacity:.45}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,10,12,.2),rgba(10,10,12,.75))}
.hero>*{position:relative;z-index:1}
.hero .hth{width:72px;height:72px;border-radius:14px;overflow:hidden;flex:none;box-shadow:0 10px 26px rgba(0,0,0,.45)}
.hero .hth img{width:100%;height:100%;object-fit:cover}
.hero .hm{flex:1;min-width:0}
.hero small{color:var(--acc2);font-size:12px;font-weight:600}
.hero b{display:block;font-size:16px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero span{display:block;font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .ib{width:50px;height:50px}
.hscroll{display:flex;gap:14px;overflow-x:auto;margin:0 -18px;padding:2px 18px 6px;scrollbar-width:none;scroll-snap-type:x mandatory}
.hscroll::-webkit-scrollbar{display:none}
.plc{width:132px;flex:none;scroll-snap-align:start}
.plc .cv{width:132px;height:132px;border-radius:16px}
.plc b{display:block;font-size:14px;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plc span{font-size:12px;color:var(--mute)}

/* Covers */
.cv{position:relative;overflow:hidden;background:linear-gradient(145deg,#2a2a33,#15151a);display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;flex:none}
.cv img{width:100%;height:100%;object-fit:cover}
.cv.one{display:block}
.cv .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--acc)}
.cv .ph svg{width:40%;height:40%}
.cv.fav{background:linear-gradient(145deg,var(--acc2),var(--acc) 55%,#6b3f10)}
.cv.fav .ph{color:var(--accInk)}

/* Search */
#v-search h1.lt{margin-bottom:calc(var(--safeT) + 6px)}
.sbarW{position:sticky;top:0;margin:calc(-1 * var(--safeT)) -18px 0;padding:calc(var(--safeT) + 6px) 18px 10px;z-index:5;background:linear-gradient(var(--bg) 78%,rgba(10,10,12,0));}
form.sbar{display:flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:0 12px;height:48px;transition:border-color .2s}
form.sbar:focus-within{border-color:var(--acc)}
form.sbar>svg{color:var(--mute)}
form.sbar input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:16px;height:100%}
form.sbar input::placeholder{color:var(--dim)}
form.sbar input::-webkit-search-cancel-button{display:none}
form.sbar .ib{width:32px;height:32px;color:var(--mute)}
#sugg{margin-top:6px}
.sg{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line);font-size:15px}
.sg svg{color:var(--dim);width:18px;height:18px}
.sg span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:36px;padding:0 14px;border-radius:18px;background:var(--card2);border:1px solid var(--line);font-size:14px;display:inline-flex;align-items:center;gap:6px;max-width:100%}
.chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{height:84px;border-radius:16px;padding:14px;display:flex;align-items:flex-end;font-weight:700;font-size:16px;position:relative;overflow:hidden;text-align:start}
.tile::after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.12);left:-24px;top:-30px}
.tile:active{transform:scale(.97)}
.skel{background:linear-gradient(90deg,var(--card) 25%,var(--card2) 50%,var(--card) 75%);background-size:200% 100%;animation:sk 1.3s infinite;border-radius:10px}
@keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}
.srow{display:flex;gap:12px;align-items:center;padding:8px 0}
.note{font-size:13px;color:var(--mute);line-height:1.8}
.errbox{padding:22px;text-align:center}
.plhead{display:flex;gap:14px;align-items:center;padding:14px;margin-bottom:10px}
.plhead .cv{width:84px;height:84px;border-radius:14px}

.stabs{display:flex;gap:8px;margin:6px 0 12px}
.stabs button{height:38px;padding:0 16px;border-radius:19px;background:var(--card2);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--mute);display:inline-flex;align-items:center;gap:7px;transition:all .2s}
.stabs button svg{width:18px;height:18px}
.stabs button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.plbadge{position:absolute;bottom:5px;left:5px;display:inline-flex;align-items:center;gap:3px;background:rgba(0,0,0,.8);font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px}
.plbadge svg{width:13px;height:13px}
.more{display:flex;justify-content:center;padding:18px 0 8px;min-height:60px}
.more .spin{width:28px;height:28px;border-width:3px}
.dlmark svg{width:13px;height:13px;color:var(--acc);vertical-align:-2px;margin-inline-end:4px;stroke-width:2.4}
.offl{display:flex;align-items:center;gap:12px;padding:12px 14px;margin:0 0 14px}
.offl .si{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--card2);color:var(--acc);flex:none}
.offl .si svg{width:19px;height:19px}
.offl .sl{flex:1;min-width:0}.offl b{display:block;font-size:15px}.offl small{display:block;color:var(--mute);font-size:12.5px;margin-top:2px;line-height:1.55}
/* Library */
.lrow{display:flex;align-items:center;gap:14px;padding:9px 0}
.lrow .cv{width:64px;height:64px;border-radius:14px}
.lrow .meta{flex:1;min-width:0}
.lrow b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow span{font-size:13px;color:var(--mute)}
.lrow>svg{color:var(--dim)}
.lrow:active{opacity:.7}

/* Playlist view */
.plv-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.plv-cover{width:210px;height:210px;border-radius:22px;margin:6px auto 18px;box-shadow:0 24px 60px rgba(0,0,0,.55)}
.plv-name{text-align:center;font-size:24px;font-weight:700;margin:0}
.plv-meta{text-align:center;color:var(--mute);font-size:13.5px;margin:6px 0 18px}
.plv-acts{display:flex;gap:10px;justify-content:center;margin-bottom:14px}
.plv-acts .btn{flex:1;max-width:170px}

/* Settings */
.grp{margin-bottom:22px}
.grp>h3{font-size:13px;color:var(--mute);font-weight:600;margin:0 6px 8px}
.grp .card{overflow:hidden}
.set{display:flex;align-items:center;gap:12px;padding:13px 14px;min-height:54px;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.set .si{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--card2);color:var(--acc);flex:none}
.set .si svg{width:18px;height:18px}
.set .sl{flex:1;min-width:0}
.set .sl b{display:block;font-size:15px;font-weight:600}
.set .sl small{display:block;color:var(--mute);font-size:12.5px;margin-top:2px;line-height:1.55}
.set.col{flex-direction:column;align-items:stretch}
.set.col .top{display:flex;align-items:center;gap:12px}
.set input.tx{width:100%;height:42px;border-radius:11px;background:var(--bg2);border:1px solid var(--line);color:var(--text);padding:0 12px;font:inherit;font-size:16px;outline:0;direction:ltr;text-align:left}
.set input.tx.rtl{direction:rtl;text-align:right}
.set input.tx:focus{border-color:var(--acc)}
.set.tap:active{background:rgba(255,255,255,.03)}
.tg{width:50px;height:30px;border-radius:15px;background:#3a3a44;position:relative;flex:none;transition:background .25s}
.tg::after{content:"";position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .25s cubic-bezier(.3,.7,.3,1.2);box-shadow:0 2px 6px rgba(0,0,0,.3)}
.tg.on{background:var(--acc)}
.tg.on::after{transform:translateX(-20px)}
.seg{display:flex;background:var(--bg2);border-radius:11px;padding:3px;gap:3px;margin-top:10px}
.seg button{flex:1;height:34px;border-radius:9px;font-size:13px;font-weight:600;color:var(--mute);transition:background .2s,color .2s}
.seg button.on{background:var(--card2);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.3)}
.sw{display:flex;gap:12px;margin-top:12px}
.sw button{width:34px;height:34px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 3px var(--bg)}
.sw button.on{border-color:var(--text)}
.testout{font-size:12.5px;line-height:1.9;color:var(--mute);margin-top:10px;direction:rtl}
.testout .ok{color:#6fd99a}.testout .bad{color:var(--danger)}
.install{display:flex;gap:12px;align-items:center;padding:14px;margin-bottom:20px;background:linear-gradient(135deg,rgba(255,255,255,.04),rgba(255,255,255,.01));}
.install img{width:54px;height:54px;border-radius:13px}
.install b{font-size:15px}
.install p{margin:3px 0 0;font-size:12.5px;color:var(--mute);line-height:1.7}

/* Tabs */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;height:calc(var(--tabH) + var(--safeB));padding-bottom:var(--safeB);display:flex;
  background:rgba(12,12,15,.82);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);border-top:1px solid var(--line)}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--dim);font-size:11px;font-weight:600;transition:color .2s}
#tabs button.on{color:var(--acc)}
#tabs button svg{width:24px;height:24px}

/* Mini player */
#mini{position:fixed;left:8px;right:8px;bottom:calc(var(--tabH) + var(--safeB) + 8px);height:var(--miniH);z-index:21;border-radius:16px;overflow:hidden;
  display:flex;align-items:center;gap:11px;padding:0 8px 0 6px;background:rgba(32,32,39,.86);backdrop-filter:blur(26px) saturate(1.5);-webkit-backdrop-filter:blur(26px) saturate(1.5);
  border:1px solid rgba(255,255,255,.08);box-shadow:0 10px 30px rgba(0,0,0,.45);transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .3s}
#mini.hidden{display:flex!important;transform:translateY(140%);opacity:0;pointer-events:none}
#mini .mimg{width:48px;height:48px;border-radius:10px;overflow:hidden;flex:none;margin-right:4px;background:var(--card2)}
#mini .mimg img{width:100%;height:100%;object-fit:cover}
#mini .mm{flex:1;min-width:0}
#mini .mm div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mTitle{font-size:14.5px;font-weight:600}
#mArtist{font-size:12.5px;color:var(--mute)}
#mini .ib{width:42px;height:42px}
#mini .ib svg{width:24px;height:24px}
.mprog{position:absolute;left:12px;right:12px;bottom:0;height:2px;background:rgba(255,255,255,.08);direction:ltr}
.mprog i{display:block;height:100%;width:0;background:var(--acc);border-radius:2px}

/* Full player */
#fp{position:fixed;inset:0;z-index:40;background:#08080a;transform:translateY(100%);transition:transform .42s cubic-bezier(.2,.85,.2,1),visibility 0s linear .42s;overflow:hidden;visibility:hidden}
#fp.open{transform:none;visibility:visible;transition:transform .42s cubic-bezier(.2,.85,.2,1),visibility 0s}
.fpbg{position:absolute;inset:0;overflow:hidden}
.fpbg img{position:absolute;inset:-25%;width:150%;height:150%;object-fit:cover;filter:blur(60px) saturate(1.6) brightness(.75);opacity:.75;transform:scale(1.1)}
.fpbg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,8,10,.35) 0%,rgba(8,8,10,.55) 45%,rgba(8,8,10,.94) 100%)}
.fpin{position:relative;height:100%;display:flex;flex-direction:column;padding:calc(var(--safeT) + 8px) 24px calc(var(--safeB) + 18px);max-width:520px;margin:0 auto}
.fptop{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:4px}
.fpsrc{text-align:center;min-width:0;flex:1}
.fpsrc small{display:block;font-size:11px;color:rgba(255,255,255,.55);font-weight:500;letter-spacing:.3px}
.fpsrc b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fpart{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;padding:10px 0}
.art{width:min(100%,46vh,440px);aspect-ratio:1;border-radius:22px;overflow:hidden;position:relative;background:var(--card2);box-shadow:0 30px 70px rgba(0,0,0,.6);transition:transform .45s cubic-bezier(.3,.7,.3,1.15)}
.art img{position:absolute;top:50%;left:50%;height:133.5%;width:auto;max-width:none;transform:translate(-50%,-50%)}
body:not(.is-playing) #fp .art{transform:scale(.88)}
.artload{position:absolute;inset:0;display:none;place-items:center;background:rgba(0,0,0,.35)}
body.loading .artload{display:grid}
.spin{width:38px;height:38px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:var(--acc);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ythint{margin-top:12px;font-size:13px;color:var(--acc2);display:none;text-align:center}
body.yt-tap .ythint{display:block}
.fpmeta{display:flex;align-items:center;gap:10px;margin-top:6px}
.fpmeta .tt{flex:1;min-width:0}
#fpTitle{font-size:21px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#fpArtist{font-size:15px;color:rgba(255,255,255,.62);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#fpFav.on{color:var(--acc)}
.seek{margin-top:16px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:0;--p:0%}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:linear-gradient(90deg,var(--acc) var(--p),rgba(255,255,255,.18) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:#fff;margin-top:-5px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
input[type=range]::-moz-range-track{height:5px;border-radius:3px;background:linear-gradient(90deg,var(--acc) var(--p),rgba(255,255,255,.18) var(--p))}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:#fff;border:0}
.times{display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,.55);margin-top:2px;font-variant-numeric:tabular-nums}
.ctrls{display:flex;align-items:center;justify-content:space-between;margin:14px -6px 6px}
.ctrls .ib{width:52px;height:52px}
.ctrls .ib svg{width:30px;height:30px}
.ctrls .sm svg{width:23px;height:23px;color:rgba(255,255,255,.6)}
.ctrls .sm.on svg{color:var(--acc)}
.ctrls .sm{position:relative}
.ctrls .sm.on::after{content:"";position:absolute;bottom:4px;width:4px;height:4px;border-radius:50%;background:var(--acc)}
#bPlay{width:78px;height:78px;background:linear-gradient(145deg,var(--acc2),var(--acc));color:var(--accInk);box-shadow:0 14px 34px var(--accGlow)}
#bPlay svg{width:34px;height:34px}
.fpbot{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.fpbot .ib{width:46px;height:46px;color:rgba(255,255,255,.7);position:relative}
.fpbot .ib.on{color:var(--acc)}
#sleepLbl{position:absolute;top:-2px;right:-6px;font-size:10px;font-weight:700;background:var(--acc);color:var(--accInk);border-radius:8px;padding:0 5px;line-height:16px}
#sleepLbl:empty{display:none}

/* YouTube host (fallback engine) */
#ytHost{position:fixed;left:0;bottom:0;width:220px;height:220px;opacity:.001;pointer-events:none;z-index:0;overflow:hidden;border-radius:22px}
#ytHost.tap{opacity:1;pointer-events:auto;z-index:45;box-shadow:0 30px 70px rgba(0,0,0,.6)}
#ytHost iframe{width:100%;height:100%;border:0}

/* Splash */
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  background:radial-gradient(120% 80% at 50% 38%,#2a1b0d 0%,#120d09 38%,#070709 72%);transition:opacity .7s ease,transform .8s cubic-bezier(.2,.8,.2,1),filter .7s;overflow:hidden}
#splash.out{opacity:0;transform:scale(1.08);filter:blur(10px);pointer-events:none}
.sp-glow{position:absolute;width:520px;height:520px;border-radius:50%;left:50%;top:40%;transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(240,190,100,.28),rgba(240,190,100,0) 62%);animation:spGlow 3.2s ease-in-out infinite}
@keyframes spGlow{0%,100%{transform:translate(-50%,-50%) scale(.9);opacity:.7}50%{transform:translate(-50%,-50%) scale(1.12);opacity:1}}
.sp-dust{position:absolute;inset:0;pointer-events:none}
.sp-dust i{position:absolute;bottom:-10px;width:3px;height:3px;border-radius:50%;background:#f7d894;opacity:0;animation:spDust linear infinite}
@keyframes spDust{0%{transform:translateY(0);opacity:0}15%{opacity:.8}100%{transform:translateY(-105vh);opacity:0}}
.sp-logoW{position:relative;width:132px;height:132px;animation:spIn 1.1s cubic-bezier(.2,.9,.25,1.25) both}
@keyframes spIn{from{opacity:0;transform:scale(.55) translateY(18px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
.sp-ring{position:absolute;inset:-20px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 55%,#f7d894 75%,#e9b660 88%,transparent 100%);
  animation:spin 1.6s linear infinite;-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));opacity:.95}
#splash.ready .sp-ring{animation:none;opacity:0;transition:opacity .4s}
.sp-logo{width:132px;height:132px;border-radius:31px;box-shadow:0 22px 60px rgba(0,0,0,.6),0 0 60px rgba(233,182,96,.25);position:relative}
.sp-name{margin-top:26px;font-size:38px;font-weight:700;letter-spacing:1px;background:linear-gradient(180deg,#fff6de,#e9b660);-webkit-background-clip:text;background-clip:text;color:transparent;animation:spUp .9s .35s cubic-bezier(.2,.8,.2,1) both}
.sp-sub{font-size:13px;color:rgba(255,240,210,.5);margin-top:2px;animation:spUp .9s .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes spUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.sp-wave{display:flex;align-items:center;gap:5px;height:34px;margin-top:34px;direction:ltr;animation:spUp .9s .65s both}
.sp-wave i{width:4px;border-radius:3px;background:linear-gradient(180deg,#ffd08a,#ff6a3d);height:8px;animation:spBar 1.1s ease-in-out infinite}
@keyframes spBar{0%,100%{height:6px;opacity:.55}50%{height:32px;opacity:1}}
#splash.ready .sp-wave i{animation-duration:.5s;animation-iteration-count:1}
.sp-status{margin-top:18px;font-size:14px;color:rgba(255,240,210,.72);min-height:22px;transition:opacity .3s;animation:spUp .9s .8s both}
.sp-skip{position:absolute;bottom:calc(var(--safeB) + 34px);height:40px;padding:0 22px;border-radius:20px;border:1px solid rgba(255,255,255,.14);color:rgba(255,255,255,.7);font-size:14px;opacity:0;transform:translateY(10px);transition:all .4s;pointer-events:none}
.sp-skip.show{opacity:1;transform:none;pointer-events:auto}
@media (prefers-reduced-motion:reduce){#splash *{animation:none!important}}

/* Sheets / modal */
#sheetWrap{position:fixed;inset:0;z-index:60;pointer-events:none}
#sheetWrap .bd{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;transition:opacity .3s}
#sheetWrap.open{pointer-events:auto}
#sheetWrap.open .bd{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:86vh;display:flex;flex-direction:column;background:#17171c;border-radius:24px 24px 0 0;border-top:1px solid rgba(255,255,255,.08);
  transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.85,.2,1);padding-bottom:calc(var(--safeB) + 10px);max-width:560px;margin:0 auto}
#sheetWrap.open .sheet{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.2);margin:9px auto 6px;flex:none}
.shead{display:flex;align-items:center;gap:12px;padding:6px 18px 12px;border-bottom:1px solid var(--line);flex:none}
.shead .th{width:48px;height:48px;border-radius:10px;overflow:hidden;flex:none}
.shead .th img{width:100%;height:100%;object-fit:cover}
.shead .m{flex:1;min-width:0}
.shead b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shead span{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.shead h3{margin:0;font-size:17px;flex:1}
.sbody{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 18px 4px}
.opt{display:flex;align-items:center;gap:14px;width:100%;padding:14px 4px;font-size:15.5px;text-align:start;border-bottom:1px solid var(--line)}
.opt:last-child{border-bottom:0}
.opt svg{color:var(--mute)}
.opt.danger,.opt.danger svg{color:var(--danger)}
.opt.on{color:var(--acc)}.opt.on svg{color:var(--acc)}
.opt:active{opacity:.6}
.qlabel{font-size:13px;color:var(--mute);font-weight:600;margin:14px 0 4px;display:flex;justify-content:space-between;align-items:center}
#modal{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#modal.open{display:flex;animation:fade .2s}
.mbox{width:100%;max-width:360px;background:#1b1b21;border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:22px}
.mbox h3{margin:0 0 6px;font-size:18px}
.mbox p{margin:0 0 14px;color:var(--mute);font-size:14px;line-height:1.7}
.mbox input{width:100%;height:48px;border-radius:13px;border:1px solid var(--line);background:var(--bg2);color:var(--text);font:inherit;font-size:16px;padding:0 14px;outline:0;margin-bottom:16px}
.mbox input:focus{border-color:var(--acc)}
.mbox .acts{display:flex;gap:10px}
.mbox .acts .btn{flex:1}
#toast{position:fixed;left:50%;bottom:calc(var(--tabH) + var(--safeB) + var(--miniH) + 22px);transform:translate(-50%,20px);z-index:90;background:rgba(40,40,48,.96);border:1px solid rgba(255,255,255,.08);
  padding:11px 18px;border-radius:14px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:all .3s;max-width:calc(100% - 40px);text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>

const IDB = {
  p: null,
  open() {
    if (IDB.p) return IDB.p;
    IDB.p = new Promise((res, rej) => {
      const r = indexedDB.open('nagham-audio', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('songs');
      r.onsuccess = () => res(r.result);
      r.onerror = () => { IDB.p = null; rej(r.error); };
    });
    return IDB.p;
  },
  async tx(mode, fn) {
    const db = await IDB.open();
    return new Promise((res, rej) => {
      const t = db.transaction('songs', mode); const r = fn(t.objectStore('songs'));
      t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  get: id => IDB.tx('readonly', s => s.get(id)),
  put: (id, v) => IDB.tx('readwrite', s => s.put(v, id)),
  del: id => IDB.tx('readwrite', s => s.delete(id)),
  keys: () => IDB.tx('readonly', s => s.getAllKeys()),
  clear: () => IDB.tx('readwrite', s => s.clear())
};
const DL = { q: [], busy: false, fail: {}, cur: null };
const isDl = id => !!DB.dl[id];
function neededIds() { const n = new Set(); DB.playlists.forEach(p => { if (p.offline) p.tracks.forEach(t => n.add(t.id)); }); return n; }
let dlSyncT = 0;
function dlSyncSoon() { clearTimeout(dlSyncT); dlSyncT = setTimeout(dlSync, 1500); }
function dlSync() {
  const need = neededIds();
  let changed = false;
  for (const id of Object.keys(DB.dl)) if (!need.has(id)) { delete DB.dl[id]; IDB.del(id).catch(() => { }); changed = true; }
  DL.q = DL.q.filter(id => need.has(id));
  for (const id of need) if (!isDl(id) && !DL.q.includes(id) && DL.cur !== id && (DL.fail[id] || 0) < 3) DL.q.push(id);
  if (changed) { saveQuiet(); dlUI(); }
  dlRun();
}
async function dlRun() {
  if (DL.busy || !DL.q.length || !srv()) return;
  DL.busy = true;
  while (DL.q.length) {
    while (PL.srvBusy) await sleep(1500); // الأولوية للأغنية اللي تشغلها الحين
    const id = DL.q.shift();
    if (isDl(id) || !neededIds().has(id)) continue;
    DL.cur = id; dlUI();
    try {
      if (!(await warmUp())) throw new Error('down');
      const c = new AbortController(); const tm = setTimeout(() => c.abort(), 240000);
      let r;
      try { r = await fetch(SV.url('dl/' + id), { signal: c.signal }); } finally { clearTimeout(tm); }
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const b = await r.blob();
      if (b.size < 20000) throw new Error('small');
      if (neededIds().has(id)) {
        await IDB.put(id, { blob: new Blob([b], { type: 'audio/mp4' }), t: Date.now() });
        DB.dl[id] = b.size; saveQuiet();
      }
    } catch (e) {
      const m = String(e && (e.name + ' ' + e.message));
      if (/Quota/i.test(m)) { toast('مساحة الجهاز ما تكفي لتنزيل المزيد', 5000); DL.q = []; break; }
      if (/down/.test(m)) { DL.q.unshift(id); break; }
      DL.fail[id] = (DL.fail[id] || 0) + 1;
      if (DL.fail[id] < 3) DL.q.push(id);
    }
  }
  DL.cur = null; DL.busy = false; dlUI();
}
function dlStats() { const ids = Object.keys(DB.dl); return { n: ids.length, bytes: ids.reduce((a, i) => a + (+DB.dl[i] || 0), 0) }; }
const mb = b => (b / 1048576).toFixed(b > 104857600 ? 0 : 1);

}

async function loadPage(type, first) {

    added = (r.items || []).filter(x => { const k = x.id || x.pl; if (!k || have.has(k)) return false; have.add(k); return true; });

function sharePlaylist(p) {
  const data = JSON.stringify({ n: p.name, t: p.tracks.map(x => [x.id, x.title, x.artist, x.dur]) });
  const bytes = new TextEncoder().encode(data); let bin = ''; bytes.forEach(b => bin += String.fromCharCode(b));
  const b64 = btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const url = location.href.split('#')[0] + '#pl=' + b64;
  shareOrCopy({ title: p.name, text: `قائمة «${p.name}» على نغم`, url });
}
async function handleHash() {
  const m = location.hash.match(/#pl=([\w-]+)/); if (!m) return;
  history.replaceState(null, '', location.href.split('#')[0]);
  try {
    let s = m[1].replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '=';
    const bin = atob(s), bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
    const d = JSON.parse(new TextDecoder().decode(bytes));
    const tracks = d.t.map(([id, title, artist, dur]) => ({ id, title, artist, dur }));
    if (await confirmModal({ title: 'استيراد قائمة؟', text: `وصلتك قائمة «${d.n}» فيها ${tracks.length} مقطع. تبي تحفظها في مكتبتك؟`, ok: 'حفظ' })) {
      DB.playlists.push({ id: uid(), name: d.n, tracks, created: Date.now() }); save(); toast('تم حفظ القائمة ✓'); showTab('lib');
    }
  } catch (e) { toast('رابط القائمة غير صالح'); }
}
async function shareOrCopy(o) {
  if (navigator.share) { try { await navigator.share(o); return; } catch (e) { if (e.name === 'AbortError') return; } }
  try { await navigator.clipboard.writeText(o.url); toast('تم نسخ الرابط ✓'); } catch (e) { promptModal({ title: 'انسخ الرابط', value: o.url, ok: 'تم' }); }
}

/* السحب لإعادة الترتيب */
function sortable(list, onDone) {
  $$('.grip', list).forEach(g => {
    g.addEventListener('pointerdown', e => {
      e.preventDefault();
      const rowEl = g.closest('.row'); const rows = () => $$(':scope > .row', list);
      const from = rows().indexOf(rowEl);
      const sc = list.closest('.view') || list.closest('.sbody');
      let startY = e.clientY; rowEl.classList.add('drag');
      try { g.setPointerCapture(e.pointerId); } catch (x) { }
      const move = ev => {
        if (sc) {
          const r = sc.getBoundingClientRect(); let d = 0;
          if (ev.clientY < r.top + 70) d = -12; else if (ev.clientY > r.bottom - 150) d = 12;
          if (d) { const b = sc.scrollTop; sc.scrollTop += d; startY -= (sc.scrollTop - b); }
        }
        let dy = ev.clientY - startY;
        const pv = rowEl.previousElementSibling, nx = rowEl.nextElementSibling;
        if (pv && pv.classList.contains('row') && dy < -pv.offsetHeight / 2) { list.insertBefore(rowEl, pv); startY -= pv.offsetHeight; dy += pv.offsetHeight; }
        else if (nx && nx.classList.contains('row') && dy > nx.offsetHeight / 2) { list.insertBefore(nx, rowEl); startY += nx.offsetHeight; dy -= nx.offsetHeight; }
        rowEl.style.transform = `translateY(${dy}px)`;
      };
      const up = () => {
        g.removeEventListener('pointermove', move); g.removeEventListener('pointerup', up); g.removeEventListener('pointercancel', up);
        rowEl.classList.remove('drag'); rowEl.style.transform = '';
        const to = rows().indexOf(rowEl);
        if (to !== from) onDone(from, to);
      };
      g.addEventListener('pointermove', move); g.addEventListener('pointerup', up); g.addEventListener('pointercancel', up);
    });
  });
}

$('#qClear').onclick = () => { $('#q').value = ''; onQInput(); $('#q').focus(); };
$('#qPaste').onclick = async () => {
  try { const t = (await navigator.clipboard.readText()).trim(); if (t) { $('#q').value = t; doSearch(t); } else toast('الحافظة فارغة'); }
  catch (e) { toast('اضغط مطولاً على خانة البحث واختر «لصق»'); $('#q').focus(); }
};
$('#sugg').addEventListener('click', e => { const s = e.target.closest('[data-q]'); if (s) doSearch(s.dataset.q); });
$('#v-set').addEventListener('click', async e => {
  const t = e.target.closest('[data-tg]'); if (t) { S()[t.dataset.tg] = !S()[t.dataset.tg]; save(); t.classList.toggle('on'); return; }
  const s = e.target.closest('[data-seg]'); if (s) {
    const k = s.dataset.seg; let v = s.dataset.v; if (k === 'histMax') { v = +v; DB.history = DB.history.slice(0, v); }
    S()[k] = v; save(); renderSet();
    if (k === 'source') { DB.inst.piped = null; DB.inst.inv = null; bad.clear(); streamCache.clear(); }
    if (k === 'engine' && v !== 'audio') YE.loadApi();
    return;
  }
  const a = e.target.closest('[data-acc]'); if (a) { S().accent = a.dataset.acc; save(); applyAccent(); renderSet(); return; }
  const d = e.target.closest('[data-do]'); if (!d) return;
  const act = d.dataset.do;
  if (act === 'export') exportData();
  if (act === 'import') $('#fileIn').click();
  if (act === 'clrDl' && dlStats().n && await confirmModal({ title: 'حذف كل التنزيلات؟', text: 'الأغاني تظل في قوائمك، بس تنحذف نسختها المحفوظة من الجهاز.', ok: 'حذف', danger: true })) {
    DB.playlists.forEach(p => p.offline = false); DB.dl = {}; DL.q = []; saveQuiet(); IDB.clear().catch(() => { }); toast('تم حذف التنزيلات'); renderSet();
  }
  if (act === 'clrH' && await confirmModal({ title: 'مسح السجل؟', ok: 'مسح', danger: true })) { DB.history = []; save(); toast('تم مسح السجل'); }
  if (act === 'clrS') { DB.searches = []; save(); toast('تم المسح'); renderSearchIdle(); }
  if (act === 'wipe' && await confirmModal({ title: 'حذف كل البيانات؟', text: 'سيتم حذف كل القوائم والسجل والإعدادات من هذا الجهاز. لا يمكن التراجع.', ok: 'حذف الكل', danger: true })) {
    localStorage.removeItem(KEY); location.reload();
  }
});

// المشغل
$('#mini').onclick = e => { if (e.target.closest('#mPlay')) { toggle(); return; } if (e.target.closest('#mNext')) { next(); return; } openFP(); };
$('#fpClose').onclick = closeFP;
$('#bPlay').onclick = toggle;
$('#bNext').onclick = () => next();
$('#bPrev').onclick = prev;
$('#bShuf').onclick = () => {
  PL.shuffle = !PL.shuffle;
  if (PL.mode === 'list') {
    if (PL.shuffle) applyShuffle();
    else if (PL.orig) { const c = cur(); const extra = PL.queue.filter(t => !PL.orig.find(o => o.id === t.id)); PL.queue = [...PL.orig, ...extra]; PL.idx = Math.max(0, PL.queue.findIndex(t => t.id === c.id)); PL.orig = null; }
  }
  toast(PL.shuffle ? 'التشغيل العشوائي: مفعّل' : 'التشغيل العشوائي: متوقف');
  renderNow(); saveSession();
};
$('#bRep').onclick = () => {
  PL.repeat = PL.repeat === 'off' ? 'all' : PL.repeat === 'all' ? 'one' : 'off';
  toast(PL.repeat === 'off' ? 'التكرار: متوقف' : PL.repeat === 'all' ? 'تكرار القائمة' : 'تكرار المقطع الحالي');
  renderNow(); saveSession();
};
$('#fpFav').onclick = () => { const t = cur(); if (t) toggleFav(t); };
$('#bAdd').onclick = () => { const t = cur(); if (t) addToPlSheet(t); };
$('#bShare').onclick = () => { const t = cur(); if (t) shareOrCopy({ title: t.title, url: 'https://youtu.be/' + t.id }); };
$('#bQueue').onclick = openQueue;
$('#fpMore').onclick = () => { const t = cur(); if (t) trackMenu(t, 'player', PL.idx); };
$('#bSleep').onclick = () => {
  const on = sleepT.until || sleepT.eot;
  openSheet(`<div class="shead"><h3>مؤقت النوم</h3></div><div class="sbody">
    ${[15, 30, 45, 60, 90].map(m => `<button class="opt" data-a="${m}">${ic('moon')}بعد ${m} دقيقة</button>`).join('')}
    <button class="opt${sleepT.eot ? ' on' : ''}" data-a="eot">${ic('note')}بعد انتهاء المقطع الحالي</button>
    ${on ? `<button class="opt danger" data-a="off">${ic('x')}إيقاف المؤقت</button>` : ''}</div>`, a => {
    clearSleep();
    if (a === 'off') { toast('تم إيقاف المؤقت'); return; }
    if (a === 'eot') { sleepT.eot = true; $('#sleepLbl').textContent = '♪'; }
    else { sleepT.until = Date.now() + a * 60000; checkSleep(); }
    $('#bSleep').classList.add('on'); toast('تم ضبط مؤقت النوم');
  });
};
let seeking = false;
const sk = $('#seek');
sk.addEventListener('input', () => {
  seeking = true;
  const d = eng().dur() || (cur() && cur().dur) || 0;
  sk.style.setProperty('--p', sk.value / 10 + '%');
  $('#tCur').textContent = fmt(sk.value / 1000 * d);
});
sk.addEventListener('change', () => {
  const d = eng().dur() || 0;
  if (d) eng().seek(sk.value / 1000 * d);
  else if (cur() && cur().dur) PL.pendingSeek = sk.value / 1000 * cur().dur;
  seeking = false; onTime();
});
(() => { // سحب المشغل للأسفل لإغلاقه
  const f = $('#fp'); let y0 = null;
  $$('.fpdrag').forEach(el => {
    el.addEventListener('touchstart', e => { if (document.body.classList.contains('yt-tap')) return; y0 = e.touches[0].clientY; f.style.transition = 'none'; }, { passive: true });
    el.addEventListener('touchmove', e => { if (y0 == null) return; const dy = Math.max(0, e.touches[0].clientY - y0); f.style.transform = `translateY(${dy}px)`; }, { passive: true });
    el.addEventListener('touchend', e => { if (y0 == null) return; const dy = e.changedTouches[0].clientY - y0; y0 = null; f.style.transition = ''; f.style.transform = ''; if (dy > 110) closeFP(); });
  });
})();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { onTime(); updatePlayBtns(); warmUp(); dlRun(); } else saveSession(); });
window.addEventListener('pagehide', () => saveSession());

/* شاشة البداية: تنتظر لين يصحى الخادم ثم تفتح التطبيق */
async function runSplash() {
  const sp = $('#splash'), st = $('#spStatus');
  $$('.sp-wave i').forEach((b, i) => b.style.animationDelay = (-(i % 5) * 0.18 - i * 0.07) + 's');
  const dust = $('#spDust');
  for (let i = 0; i < 18; i++) {
    const d = document.createElement('i');
    d.style.left = (Math.random() * 100) + '%';
    d.style.animationDuration = (6 + Math.random() * 7) + 's';
    d.style.animationDelay = (-Math.random() * 10) + 's';
    d.style.transform = 'scale(' + (0.5 + Math.random()) + ')';
    dust.appendChild(d);
  }
  const t0 = Date.now();
  const h = new Date().getHours();
  st.textContent = (h < 12 ? 'صباح الخير' : 'مساء الخير') + (DB.name ? '، ' + DB.name : '');
  if (srv()) {
    const msgs = ['نجهّز لك الموسيقى…', 'نوقظ الخادم من النوم…', 'لحظات ويكون جاهز…', 'تقريباً وصلنا…', 'شكله نومه ثقيل اليوم 😅'];
    let mi = 0;
    const rot = setInterval(() => { st.style.opacity = 0; setTimeout(() => { st.textContent = msgs[Math.min(mi++, msgs.length - 1)]; st.style.opacity = 1; }, 300); }, 4500);
    setTimeout(() => { st.style.opacity = 0; setTimeout(() => { st.textContent = msgs[mi++]; st.style.opacity = 1; }, 300); }, 1300);
    const skipT = setTimeout(() => $('#spSkip').classList.add('show'), 8000);
    let skip; const skipped = new Promise(r => skip = r);
    $('#spSkip').onclick = () => skip('skip');
    const res = await Promise.race([warmUp(), skipped, sleep(80000).then(() => false)]);
    clearInterval(rot); clearTimeout(skipT);
    st.style.opacity = 1;
    st.textContent = res === true ? 'جاهز ✓' : res === 'skip' ? '' : 'الخادم ما رد — بنكمل بالطريقة الاحتياطية';
    if (res === 'skip') warmUp();
  }
  const wait = Math.max(0, 1700 - (Date.now() - t0));
  await sleep(wait);
  sp.classList.add('ready');
  await sleep(450);
  sp.classList.add('out');
  splashOn = false;
  setTimeout(() => sp.remove(), 900);
}

/* ---------------- التشغيل الأولي ---------------- */
applyAccent();
restoreSession();
renderSearchIdle();
showTab('home');
handleHash();
setTimeout(() => YE.loadApi(), 1500);
refreshInstanceLists();
runSplash();
initDownloads();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => { });
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
